name: Release

run-name: ${{ github.event_name == 'push' && 'Publish' || 'Draft' }} arm64 release for ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v*-preview.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify as a draft, for example v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Verify and package arm64 DMG
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.event.deleted == false && github.event.forced == false)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_EVENT: ${{ github.event_name }}
      DOCKSHELL_APP_OUTPUT_ROOT: ${{ github.workspace }}/Build/ci-app
    outputs:
      dmg_artifact_id: ${{ steps.upload-dmg.outputs.artifact-id }}
      metadata_artifact_id: ${{ steps.upload-metadata.outputs.artifact-id }}
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
      build: ${{ steps.package.outputs.build }}
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - name: Validate requested tag syntax
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf '%s\n' 'A version tag such as v0.1.0 or v0.1.0-preview.3 is required.' >&2
            exit 1
          fi
          if [ "$RELEASE_EVENT" = push ] && [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]]; then
            printf '%s\n' 'Automatic publication requires a standard version or numbered preview tag.' >&2
            exit 1
          fi

      - name: Check out the existing version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require DMG packaging in the selected tag
        run: |
          set -euo pipefail
          if [ ! -f Scripts/package-dmg.sh ] || [ ! -f Scripts/test-dmg-packaging.sh ]; then
            printf '%s\n' 'This tag predates DMG packaging. Select a new tag containing the DMG changes, such as v0.1.0-preview.2; existing tags are not moved.' >&2
            exit 1
          fi

      - name: Check pinned build environment and source version
        run: |
          set -euo pipefail
          mkdir -p Build/ci-logs
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee Build/ci-logs/xcode.txt
          grep -Fx 'Xcode 26.6' Build/ci-logs/xcode.txt
          xcrun swift --version | tee Build/ci-logs/swift.txt
          grep -E 'Apple Swift version 6\.' Build/ci-logs/swift.txt
          sh Scripts/check-environment.sh 2>&1 | tee Build/ci-logs/environment.txt
          sh Scripts/ci-release.sh validate "$RELEASE_TAG"

      - name: Verify scripts and application
        run: |
          set -euo pipefail
          sh Scripts/test-release-scripts.sh 2>&1 | tee Build/ci-logs/release-guards.txt
          sh Scripts/test-ci-release.sh 2>&1 | tee Build/ci-logs/ci-release-guards.txt
          sh Scripts/test-dmg-packaging.sh 2>&1 | tee Build/ci-logs/dmg-guards.txt
          sh Scripts/test.sh 2>&1 | tee Build/ci-logs/tests.txt

      - name: Prepare ad-hoc signed DMG assets
        id: package
        run: |
          set -euo pipefail
          sh Scripts/ci-release.sh prepare "$RELEASE_TAG" 2>&1 | tee Build/ci-logs/package.txt

      - name: Check DMG output contract
        env:
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          ARTIFACT_DIR: ${{ steps.package.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          if [ -z "$DMG_PATH" ] || [ -z "$ARTIFACT_DIR" ] || [ ! -f "$DMG_PATH" ]; then
            printf '%s\n' 'The selected tag did not produce a DMG installer. Use a tag containing the current DMG packaging helper.' >&2
            exit 1
          fi
          case "$DMG_PATH" in "$ARTIFACT_DIR"/*.dmg) ;; *) exit 1 ;; esac

      - name: Upload the DMG without an outer archive
        id: upload-dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.dmg_path }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums and preview metadata
        id: upload-metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DockShell-arm64-preview-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.artifact_dir }}/SHA256SUMS
            ${{ steps.package.outputs.artifact_dir }}/ReleaseManifest.plist
            ${{ steps.package.outputs.artifact_dir }}/ReleaseNotes.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: Build/ci-logs/
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Create release with DMG assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      APP_VERSION: ${{ needs.build.outputs.version }}
      APP_BUILD: ${{ needs.build.outputs.build }}
      SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_EVENT: ${{ github.event_name }}
    steps:
      - name: Download this run's verified preview assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dmg_artifact_id }},${{ needs.build.outputs.metadata_artifact_id }}
          path: preview
          merge-multiple: true
          digest-mismatch: error

      - name: Verify assets and refuse an existing release
        working-directory: preview
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APP_BUILD" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          dmg_name="DockShell-$APP_VERSION-$APP_BUILD-arm64-local-preview.dmg"
          test -f "$dmg_name"
          test -f ReleaseManifest.plist
          test -f ReleaseNotes.md
          checksum_record=$(cat SHA256SUMS)
          checksum_digest=${checksum_record%% *}
          [[ "$checksum_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$checksum_record" = "$checksum_digest  $dmg_name"
          sha256sum --check --strict SHA256SUMS
          ref_details=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '[.ref, .object.type, .object.sha] | @tsv')
          read -r remote_ref object_type remote_commit <<< "$ref_details"
          test "$remote_ref" = "refs/tags/$RELEASE_TAG"
          depth=0
          while [ "$object_type" = tag ]; do
            depth=$((depth + 1))
            test "$depth" -le 16
            [[ "$remote_commit" =~ ^[0-9a-f]{40}$ ]]
            object_details=$(gh api "repos/$GH_REPO/git/tags/$remote_commit" --jq '[.object.type, .object.sha] | @tsv')
            read -r object_type remote_commit <<< "$object_details"
          done
          test "$object_type" = commit
          test "$remote_commit" = "$SOURCE_COMMIT"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/existing-release-tags"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/existing-release-tags"; then
            printf '%s\n' 'A release for this tag already exists; no assets were overwritten.' >&2
            exit 1
          fi

      - name: Publish a tagged version or create a manual draft
        working-directory: preview
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --latest=false)
          release_title="DockShell $RELEASE_TAG (arm64 preview)"
          case "$RELEASE_EVENT" in
            push)
              if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                release_flags=(--verify-tag --latest)
                release_title="DockShell $RELEASE_TAG (Apple Silicon)"
              elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]]; then
                release_flags+=(--prerelease)
              else
                printf '%s\n' 'Unsupported automatic release tag.' >&2
                exit 1
              fi
              ;;
            workflow_dispatch) release_flags+=(--draft --prerelease) ;;
            *) printf '%s\n' 'Unsupported release event.' >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" \
            "DockShell-$APP_VERSION-$APP_BUILD-arm64-local-preview.dmg" \
            SHA256SUMS ReleaseManifest.plist \
            "${release_flags[@]}" \
            --title "$release_title" \
            --notes-file ReleaseNotes.md

      - name: Verify the public Release DMG download
        if: github.event_name == 'push'
        working-directory: preview
        run: |
          set -euo pipefail
          dmg_name="DockShell-$APP_VERSION-$APP_BUILD-arm64-local-preview.dmg"
          release_metadata=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s' "$release_metadata" | jq -e '.draft == false and .prerelease == false' >/dev/null
            latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            test "$latest_tag" = "$RELEASE_TAG"
          else
            printf '%s' "$release_metadata" | jq -e '.draft == false and .prerelease == true' >/dev/null
          fi
          download_url=$(printf '%s' "$release_metadata" | jq -er --arg name "$dmg_name" '.assets[] | select(.name == $name and .state == "uploaded") | .browser_download_url')
          test "$download_url" = "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$dmg_name"
          # Download anonymously, so a maintainer-only draft cannot pass this check.
          published_dmg="$RUNNER_TEMP/published-preview.dmg"
          curl --fail --location --retry 3 --silent --show-error --output "$published_dmg" "$download_url"
          checksum_digest=$(cut -d ' ' -f 1 SHA256SUMS)
          printf '%s  %s\n' "$checksum_digest" "$published_dmg" | sha256sum --check --strict
          {
            printf '### Published DMG release\n\n'
            printf '[Release page](https://github.com/%s/releases/tag/%s)\n\n' "$GH_REPO" "$RELEASE_TAG"
            printf '[Download DMG](%s)\n' "$download_url"
          } >> "$GITHUB_STEP_SUMMARY"
